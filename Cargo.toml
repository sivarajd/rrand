[package]
name = "rrand"
version = "0.1.0"
edition = "2021"
authors = ["Sivaraj D <sivarajd@gmail.com>"]
description = "A versatile random generator CLI and library inspired by random.org and openssl rand"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sivarajd/rrand"
keywords = ["random", "generator", "cli", "uuid", "openssl"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[lib]
name = "rrand"
path = "src/lib.rs"

[[bin]]
name = "rrand"
path = "src/main.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v1", "v4", "v7", "fast-rng"] }
ulid = "1.1"
hex = "0.4"
base64 = "0.22"
is-terminal = "0.4"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
